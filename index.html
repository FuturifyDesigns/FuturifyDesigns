<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=()">
    <script src="js/security.js" defer></script>
    <script src="js/cms-cloud.js" defer></script>

    <title>Futurify Designs — Crafting Digital Experiences</title>
    <meta name="description" content="Futurify Designs — Professional web development and digital solutions in Gaborone, Botswana.">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="logo-f-nav.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://futurifydesigns.com/">
    <meta property="og:title" content="Futurify Designs — Crafting Digital Experiences">
    <meta property="og:description" content="Professional web development and digital solutions in Gaborone, Botswana.">
    <meta property="og:image" content="https://futurifydesigns.com/logo-f-gold.png">
    <meta http-equiv="refresh" content="4;url=home.html">
    <link rel="stylesheet" href="css/brand.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            color: #f3eee4;
            font-family: var(--font-body);
        }

        .splash {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            position: relative;
            padding: 32px;
            background:
                radial-gradient(ellipse 55% 45% at 50% 40%, rgba(201,162,75,0.14), transparent 70%),
                linear-gradient(180deg, #0a0a0a 0%, #0d0c0a 100%);
        }

        .splash-inner {
            text-align: center;
            animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .splash-logo {
            width: min(42vw, 160px);
            height: auto;
            margin: 0 auto 28px;
            filter: drop-shadow(0 18px 40px rgba(201,162,75,0.22));
            animation: logoPulse 2.4s ease-in-out infinite;
        }

        .splash-word {
            font-family: var(--font-display);
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .splash-word span { color: var(--gold); font-style: italic; font-weight: 500; }

        .splash-sub {
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 36px;
        }

        .splash-bar {
            width: min(180px, 50vw);
            height: 1px;
            margin: 0 auto 28px;
            background: rgba(201,162,75,0.18);
            overflow: hidden;
        }
        .splash-bar > i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--gold);
            animation: barFill 2.4s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        }

        .skip {
            position: absolute;
            bottom: clamp(28px, 5vh, 48px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid transparent;
            transition: color 0.3s, border-color 0.3s;
            animation: fadeUp 0.9s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .skip:hover {
            color: var(--gold);
            border-color: var(--gold);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes logoPulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes barFill {
            from { width: 0; }
            to { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .splash-inner, .skip, .splash-logo, .splash-bar > i {
                animation: none !important;
            }
            .splash-bar > i { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="splash-inner">
            <img src="logo-f-gold.png" alt="Futurify Designs" class="splash-logo">
            <div class="splash-word">Futurify <span>Designs</span></div>
            <div class="splash-sub">Digital Studio · Gaborone</div>
            <div class="splash-bar" aria-hidden="true"><i></i></div>
        </div>
        <a class="skip" href="home.html">Skip intro</a>
    </div>

    <script>
    (function () {
        var done = false;
        function go() {
            if (done) return;
            done = true;
            window.location.replace('home.html');
        }
        setTimeout(go, 2500);
        // Absolute failsafe — never hang on splash
        setTimeout(go, 4000);
    })();
    </script>
</body>
</html>
