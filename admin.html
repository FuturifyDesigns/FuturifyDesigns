<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futurify Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#060606; --fg:#f2ede5; --accent:#c8f135; --dim:rgba(242,237,229,0.14); --muted:rgba(242,237,229,0.62); }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top, rgba(200,241,53,0.1), transparent 35%), #060606; color:var(--fg); font-family:'Syne',sans-serif; padding:24px; }
        .card { width:min(520px,100%); background:rgba(6,6,6,0.92); border:1px solid var(--dim); padding:32px; }
        h1 { font-size:clamp(30px,5vw,46px); margin-bottom:10px; }
        p { color:var(--muted); line-height:1.7; margin-bottom:24px; font-family:'DM Mono',monospace; font-size:13px; }
        label { display:block; margin:14px 0 8px; font:700 11px 'DM Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
        input { width:100%; padding:14px; background:#111; color:var(--fg); border:1px solid var(--dim); font:400 14px 'DM Mono',monospace; }
        button { width:100%; margin-top:20px; padding:14px; background:var(--accent); color:var(--bg); border:none; font:800 14px 'Syne',sans-serif; cursor:pointer; }
        .hint { margin-top:16px; font-size:12px; }
        .status { margin-top:14px; color:#ffb4b4; min-height:18px; font-family:'DM Mono',monospace; font-size:12px; }
        .links { display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }
        .links a { color:var(--accent); text-decoration:none; font:700 12px 'DM Mono',monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Admin Mode</h1>
        <p>Edit text, prices, links, images, visibility, and custom sections directly on the site. Changes are stored in the shared site CMS.</p>
        <form id="adminLogin">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password">
            <button type="submit">Enter Admin Mode</button>
            <div class="status" id="status"></div>
        </form>
        <div class="hint">Sign in here, then open any page you want to edit.</div>
        <div class="links">
            <a href="home.html">Home</a>
            <a href="pricing.html">Pricing</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
    <script src="js/cms-cloud.js"></script>
    <script>
        (function () {
            var form = document.getElementById('adminLogin');
            var status = document.getElementById('status');
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                var email = document.getElementById('email').value.trim().toLowerCase();
                var password = document.getElementById('password').value;
                status.textContent = 'Signing in...';
                window.FuturifyCMS.login(email, password).then(function () {
                    location.href = 'home.html';
                }).catch(function (error) {
                    status.textContent = error.message || 'Unable to sign in.';
                });
            });
        })();
    </script>
</body>
</html>
