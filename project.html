    <style>
        .detail-page {
            min-height: 100vh;
            padding: calc(var(--nav-h) + clamp(28px, 5vh, 48px)) var(--space-x) clamp(48px, 8vh, 96px);
            background:
                radial-gradient(ellipse 55% 40% at 10% 20%, rgba(201,162,75,0.08), transparent 65%),
                radial-gradient(ellipse 40% 35% at 90% 70%, rgba(201,162,75,0.05), transparent 70%),
                linear-gradient(180deg, #0a0a0a 0%, #0d0c0a 100%);
            overflow-x: hidden;
            max-width: 100%;
        }

        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: clamp(28px, 4vh, 40px);
            transition: color 0.3s;
        }
        .detail-back:hover { color: var(--gold); }
        .detail-back i { font-size: 10px; }

        .detail-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) minmax(0, 0.75fr);
            gap: clamp(28px, 4vw, 48px);
            align-items: start;
            max-width: 1320px;
            margin: 0 auto;
            width: 100%;
        }

        .detail-media {
            position: relative;
            border: 1px solid var(--gold-border);
            background: #0e0e0e;
            overflow: hidden;
            isolation: isolate;
            width: 100%;
            max-width: 100%;
            transform: translateZ(0);
            backface-visibility: hidden;
            contain: layout paint;
        }
        .detail-media::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(201,162,75,0.08);
            z-index: 2;
        }
        .detail-media video,
        .detail-media img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            object-position: center center;
            background: #111;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        .detail-media img[hidden],
        .detail-media video[hidden] {
            display: none !important;
        }
        .detail-media.is-phone { background: #0a0a0a; }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: clamp(8px, 1.5vw, 12px) 0;
            min-width: 0;
        }
        .detail-kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
        }
        .detail-kicker::before {
            content: '';
            width: 22px;
            height: 1px;
            background: var(--gold);
            flex-shrink: 0;
        }
        .detail-info h1 {
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.05;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .detail-tags span {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            border: 1px solid var(--gold-border);
            padding: 5px 10px;
        }
        .detail-desc {
            font-size: clamp(15px, 1.35vw, 17px);
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.75;
            max-width: 42ch;
        }
        .detail-meta {
            display: grid;
            gap: 14px;
            padding: 20px 0;
            border-top: 1px solid var(--gold-border);
            border-bottom: 1px solid var(--gold-border);
        }
        .detail-meta-row {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 12px;
            font-size: 13px;
        }
        .detail-meta-row dt {
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 10px;
            color: var(--gold);
            font-weight: 500;
            padding-top: 2px;
        }
        .detail-meta-row dd {
            color: var(--text-muted);
            font-weight: 300;
            overflow-wrap: anywhere;
        }
        .detail-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .detail-actions .btn { max-width: 100%; }

        .site-footer {
            border-top: 1px solid var(--gold-border);
            padding: clamp(40px, 6vh, 64px) var(--space-x) max(28px, env(safe-area-inset-bottom, 0px) + 28px);
        }
        .footer-bottom {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-muted);
            max-width: 1280px;
            margin: 0 auto;
        }
        .footer-bottom a { margin-left: 18px; }
        .footer-bottom a:hover { color: var(--gold); }

        .detail-missing {
            max-width: 520px;
            margin: 10vh auto;
            text-align: center;
            padding: 0 8px;
        }
        .detail-missing h1 { font-size: clamp(28px, 6vw, 36px); margin-bottom: 12px; }
        .detail-missing p { color: var(--text-muted); margin-bottom: 24px; font-weight: 300; }

        @media (max-width: 1100px) {
            .detail-layout {
                grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr);
                gap: 24px;
            }
        }

        @media (max-width: 900px) {
            .detail-page {
                padding: calc(var(--nav-h) + 20px) var(--space-x) clamp(40px, 7vh, 72px);
            }
            .detail-layout {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .detail-info { order: 2; }
            .detail-media { order: 1; }
            .detail-desc { max-width: none; }
            .detail-media video,
            .detail-media img {
                aspect-ratio: 16 / 10;
                min-height: 0;
                height: auto;
            }
        }

        @media (max-width: 600px) {
            .detail-page {
                padding: calc(var(--nav-h) + 16px) max(16px, var(--space-x)) calc(40px + env(safe-area-inset-bottom, 0px));
            }
            .detail-back {
                margin-bottom: 20px;
                font-size: 10px;
            }
            .detail-info {
                gap: 14px;
                padding: 0;
            }
            .detail-info h1 {
                font-size: clamp(28px, 9vw, 36px);
            }
            .detail-desc {
                font-size: 15px;
                line-height: 1.7;
            }
            .detail-meta {
                padding: 16px 0;
                gap: 12px;
            }
            .detail-meta-row {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .detail-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .detail-actions .btn {
                width: 100%;
                justify-content: center;
            }
            .detail-media video,
            .detail-media img {
                aspect-ratio: 16 / 11;
            }
            .footer-bottom {
                flex-direction: column;
                gap: 10px;
            }
            .footer-bottom a { margin-left: 0; margin-right: 14px; }
        }

        @media (max-width: 380px) {
            .detail-tags span {
                font-size: 9px;
                padding: 4px 8px;
            }
            .detail-media video,
            .detail-media img {
                aspect-ratio: 4 / 3;
            }
        }
    </style>

        var id = (params.get('id') || '').toLowerCase();
        var project = PROJECTS[id];

        var content = document.getElementById('detailContent');
        var missing = document.getElementById('detailMissing');

        if (!project) {
            missing.hidden = false;
            return;
        }

        content.hidden = false;
        document.title = project.title + ' — Futurify Designs';
        document.querySelector('meta[name="description"]').setAttribute(
            'content',
            project.summary
        );

        document.getElementById('detailType').textContent = project.type;
        document.getElementById('detailTitle').textContent = project.title;
        document.getElementById('detailDesc').textContent = project.summary;

        var tagsEl = document.getElementById('detailTags');
        tagsEl.innerHTML = project.tags.map(function (t) {
            return '<span>' + t + '</span>';
        }).join('');

        var metaEl = document.getElementById('detailMeta');
        metaEl.innerHTML =

        var cta = document.getElementById('detailCta');
        cta.href = project.url;
        cta.innerHTML = project.cta + ' <i class="fas fa-arrow-right"></i>';

        var media = document.getElementById('detailMedia');
        if (project.phone) media.classList.add('is-phone');

        var video = document.getElementById('detailVideo');
        var image = document.getElementById('detailImage');
        if (project.image) {
            image.hidden = false;
            image.src = project.image;
            image.alt = project.title;
            video.hidden = true;
            video.removeAttribute('src');
        } else {
            video.hidden = false;
            image.hidden = true;
            image.removeAttribute('src');
            video.src = project.video;
            video.setAttribute('aria-label', project.title + ' preview slideshow');
            var play = video.play();
            if (play && typeof play.catch === 'function') play.catch(function () {});
